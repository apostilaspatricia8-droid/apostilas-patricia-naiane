
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel administrativo | Apostilas da Patrícia Naiane</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 20px;
      color: #26352c;
      background: #f7f5ed;
    }
    h1 { color: #24543b; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font: inherit;
      border-radius: 6px;
    }
    input, textarea { border: 1px solid #bbb; background: white; }
    button {
      margin-top: 20px;
      border: 0;
      background: #24543b;
      color: white;
      cursor: pointer;
    }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    .aviso { color: #654c1d; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Painel de apostilas</h1>
  
<hr>
<h2>Enviar PDF para uma apostila</h2>

<label for="upload-id">ID da apostila</label>
<input id="upload-id" placeholder="Cole o ID da apostila" required>

<label for="upload-token">Token administrativo</label>
<input id="upload-token" type="password"
       autocomplete="off" placeholder="Seu token administrativo" required>

<label for="upload-pdf">Arquivo PDF</label>
<input id="upload-pdf" type="file" accept="application/pdf,.pdf" required>

<button id="upload-button" type="button">Enviar PDF</button>
<p id="upload-status" role="status"></p>
  
  <hr>
  <h2>Publicar uma apostila cadastrada</h2>
  <p>Informe o ID recebido após cadastrar a apostila.</p>

  <label for="publish-id">ID da apostila</label>
  <input id="publish-id" placeholder="Cole aqui o ID da apostila">

  <label for="publish-token">Token administrativo</label>
  <input id="publish-token" type="password" autocomplete="off"
         placeholder="Seu token administrativo">

  <button id="publish-button" type="button">
    Publicar apostila
  </button>

  <p id="publish-status" role="status"></p>
  <p class="aviso">
    Área administrativa. Não compartilhe seu token.
    O cadastro ficará como rascunho e ainda não aparecerá na loja.
  </p>

  <form id="product-form">
    <label for="token">Token administrativo</label>
    <input id="token" type="password" autocomplete="off" required>

    <label for="title">Nome da apostila</label>
    <input id="title" maxlength="180" required>

    <label for="description">Descrição</label>
    <textarea id="description" rows="4"></textarea>

    <label for="price">Preço em reais (ex.: 19,90)</label>
    <input id="price" inputmode="decimal" placeholder="19,90" required>

    <label for="cover">Link HTTPS da capa (opcional)</label>
    <input id="cover" type="url" placeholder="https://...">

    <button type="submit">Cadastrar rascunho</button>
  </form>

  <p id="status" role="status"></p>

  <script>
    const API = "https://apostilas-patricia-api.apostilaspatricia8.workers.dev";
    const form = document.querySelector("#product-form");
    const status = document.querySelector("#status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Cadastrando...";

      const token = document.querySelector("#token").value;
      const title = document.querySelector("#title").value.trim();
      const description = document.querySelector("#description").value.trim();
      const priceText = document.querySelector("#price").value.trim();
      const cover = document.querySelector("#cover").value.trim();
      const normalizedPrice = priceText.replace(",", ".");
      const price = Number(normalizedPrice);

      if (!Number.isFinite(price) || price < 0 || !/^\d+(\.\d{1,2})?$/.test(normalizedPrice)) {
        status.textContent = "Digite um preço válido, como 19,90.";
        return;
      }

      try {
        const response = await fetch(`${API}/api/admin/products`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            title,
            description,
            price_cents: Math.round(price * 100),
            cover_url: cover || null
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            response.status === 401
              ? "Token inválido ou não configurado."
              : result.error || `Erro HTTP ${response.status}`
          );
        }

        status.textContent =
          `Rascunho cadastrado!\nID: ${result.id}\nAinda não está publicado na loja.`;
        form.reset();
      } catch (error) {
        status.textContent = `Não foi possível cadastrar: ${error.message}`;
      }
    });

  async function publishProduct(id, token) {
    const response = await fetch(`${API}/api/admin/products/publish`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ id })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || `Erro HTTP ${response.status}`);
    }

    return result;
  }
    
document.querySelector("#publish-button").addEventListener("click", async () => {
  const id = document.querySelector("#publish-id").value.trim();
  const token = document.querySelector("#publish-token").value;
  const status = document.querySelector("#publish-status");

  if (!id || !token) {
    status.textContent = "Informe o ID da apostila e o token.";
    return;
  }

  status.textContent = "Publicando...";

  try {
    await publishProduct(id, token);
    status.textContent = "Apostila publicada com sucesso!";
    document.querySelector("#publish-token").value = "";
  } catch (error) {
    status.textContent = `Erro: ${error.message}`;
  }
});
 
document.querySelector("#upload-button").addEventListener("click", async () => {
  const id = document.querySelector("#upload-id").value.trim();
  const token = document.querySelector("#upload-token").value;
  const file = document.querySelector("#upload-pdf").files[0];
  const status = document.querySelector("#upload-status");

  if (!id || !token || !file) {
    status.textContent = "Informe o ID, o token e selecione um PDF.";
    return;
  }

  if (file.type !== "application/pdf" || !file.name.toLowerCase().endsWith(".pdf")) {
    status.textContent = "Selecione um arquivo PDF válido.";
    return;
  }

  if (file.size > 25 * 1024 * 1024) {
    status.textContent = "O PDF deve ter no máximo 25 MB.";
    return;
  }

  const formData = new FormData();
  formData.append("id", id);
  formData.append("pdf", file);

  status.textContent = "Enviando PDF...";

  try {
    const response = await fetch(`${API}/api/admin/products/upload`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${token}`
      },
      body: formData
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || `Erro HTTP ${response.status}`);
    }

    status.textContent = "PDF enviado e associado à apostila com sucesso!";
    document.querySelector("#upload-token").value = "";
    document.querySelector("#upload-pdf").value = "";
  } catch (error) {
    status.textContent = `Falha no envio: ${error.message}`;
  }
});
  </script>
</body>
</html>
